[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-stamper"
version = "0.1.0.dev0"
description = "Add a configurable text stamp (case number, document type, page numbers) to every page of a document and save a new copy."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Michael Bryan" }]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
]

# Exact pins: this is an application, not a library, and output must be
# reproducible between the dev machine and the packaged build.
dependencies = [
    "PyMuPDF==1.28.2",
    "PySide6==6.12.0",
    "pydantic==2.14.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pyinstaller==6.22.3",
]

[project.urls]
Repository = "https://github.com/MBryan897/document-stamper"

[project.scripts]
stamper = "stamper.__main__:main"

[tool.setuptools.packages.find]
include = ["stamper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
