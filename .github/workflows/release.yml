# Builds DocumentStamper.exe on a GitHub-hosted Windows machine with packaging\build.ps1,
# the same script used for a local build.
#
#   Push a tag v<version>   builds from that tag, records where the exe came from
#                           (a build attestation), and makes a DRAFT release holding the exe,
#                           SHA256SUMS.txt and BUILD-INFO.txt. Nothing is public until the
#                           draft is published by hand.
#   Run workflow (manual)   builds and keeps the exe as a workflow artifact for 14 days.
#   Pull request            the same test build, when the build itself is being changed.
#
# The build job can only read the repository. Only the release job can write, it runs
# nothing from the repository, and it waits for approval in the "release" environment.
# No secrets are used. Actions are pinned to full commit IDs.
name: Release build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "requirements/**"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the exe
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.6"

      - name: The tag must match the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            Write-Host "Tag $env:GITHUB_REF_NAME doesn't match version $version in pyproject.toml."
            exit 1
          }

      - name: Install the dev tools from the hash-pinned lock
        shell: powershell
        run: |
          python -m venv .venv
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\.venv\Scripts\Activate.ps1
          python -m pip install --require-hashes -r requirements\dev.lock
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install --no-deps --no-build-isolation -e .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # -Release: clean tree, full test suite, pip-audit required. A hosted runner's only
      # account is an administrator, which build.ps1 otherwise refuses.
      - name: Build (full tests, audit, exe checks)
        shell: powershell
        run: |
          .\.venv\Scripts\Activate.ps1
          .\packaging\build.ps1 -Release -AllowAdministrator
          exit $LASTEXITCODE

      - name: Show what was built
        shell: powershell
        run: |
          Get-Content dist\BUILD-INFO.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DocumentStamper
          path: |
            dist/DocumentStamper.exe
            dist/SHA256SUMS.txt
            dist/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write      # create the draft release
      id-token: write      # sign the build attestation
      attestations: write  # store the build attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: DocumentStamper
          path: dist

      - name: The exe must match SHA256SUMS.txt
        run: |
          want="$(tr -d '\r' < dist/SHA256SUMS.txt | awk 'NR==1 {print tolower($1)}')"
          have="$(sha256sum dist/DocumentStamper.exe | awk '{print $1}')"
          echo "SHA256SUMS.txt: $want"
          echo "DocumentStamper.exe: $have"
          test -n "$want" && test "$want" = "$have"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/DocumentStamper.exe

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "Portable build of Document Stamper ${TAG#v}, built on GitHub from tag \`$TAG\`. See CHANGELOG.md for what changed."
            echo
            echo "To check a copy (PowerShell):"
            echo
            echo '```'
            echo "Get-FileHash .\\DocumentStamper.exe -Algorithm SHA256     # must equal the value in SHA256SUMS.txt"
            echo "gh attestation verify .\\DocumentStamper.exe --repo $GH_REPO"
            echo '```'
            echo
            echo "The exe is not code-signed."
          } > notes.md
          gh release create "$TAG" --draft --verify-tag \
            --title "Document Stamper ${TAG#v}" --notes-file notes.md \
            dist/DocumentStamper.exe dist/SHA256SUMS.txt dist/BUILD-INFO.txt
